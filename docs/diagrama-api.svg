<text x="840" y="168.75" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">Dados</text>
<text x="840" y="191.25" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">(array em memoria)</text>
<line x1="204" y1="170" x2="276" y2="170" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
<line x1="444" y1="170" x2="516" y2="170" stroke="#1e1e1e" stroke-width="2" marker-end="url(#a)"/>
