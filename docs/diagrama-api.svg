<text x="40" y="401" font-size="16" font-family="Segoe UI, Arial, sans-serif" fill="#1e1e1e" text-anchor="start" dominant-baseline="auto">404  { "erro": "Aluno nao encontrado" }</text>
<text x="560" y="320" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#1e1e1e" text-anchor="start" dominant-baseline="auto">Modelo Aluno</text>
