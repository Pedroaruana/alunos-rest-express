name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sobe a API e testa as rotas
        run: |
          node src/server.js &
          sleep 2
          curl -fsS http://localhost:3000/alunos
          curl -fsS http://localhost:3000/alunos/1
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/alunos/999)" = "404"
